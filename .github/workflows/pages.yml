name: Deploy GitHub Pages

on:
  schedule:
    # 09:17 Asia/Shanghai every day. GitHub may queue scheduled runs.
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      mock:
        description: "Generate a downloadable sample preview only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build sample preview
        if: ${{ inputs.mock }}
        run: python scripts/build_static_site.py --mock --output site
      - name: Collect and render the daily edition
        if: ${{ !inputs.mock }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USE_MOCK_WHEN_NO_TOKEN: "false"
          DATABASE_URL: sqlite:///./data/radar.db
        run: python scripts/build_static_site.py --collect --limit 120 --output site
      - name: Persist daily editions and ranking baselines
        if: ${{ !inputs.mock && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public-data collection-state
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): publish daily AI radar edition"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mock || github.ref != 'refs/heads/main' }}
        with:
          name: radar-preview
          path: site/
      - uses: actions/upload-pages-artifact@v4
        if: ${{ !inputs.mock && github.ref == 'refs/heads/main' }}
        with:
          path: site/

  deploy:
    if: ${{ !inputs.mock && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
